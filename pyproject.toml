[project]
name = "llm-price-monitor"
version = "0.1.0"
description = "Assay 试金：多中转站模型价格取证、监控与官方价审计"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28,<1",
  "playwright>=1.40",
  "uvicorn>=0.34",
]

[project.scripts]
price-web = "llm_price_monitor.webapi.app:main"
price-admin = "llm_price_monitor.admin_cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_price_monitor*"]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
