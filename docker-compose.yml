# llm-price-monitor 生产部署编排：api（FastAPI 后端 + 内置调度）+ web（Next.js 前端）
# 使用步骤与运维手册见 docs/deploy/docker-compose.md；
# 交给 AI 助手部署时，让它先读 docs/deploy/ai-runbook.md。
name: llm-price-monitor

services:
  api:
    # 单实例设计：定时调度与任务状态都在进程内存里，多副本会重复采集，禁止 scale
    build:
      context: .
      target: api
    image: llm-price-monitor/api:local
    container_name: price-monitor-api
    restart: unless-stopped
    volumes:
      - ./var:/app/var # SQLite 与全部运行数据的唯一落盘位置
      # - ./config:/app/config:ro # 需要在不重建镜像的情况下改种子配置时放开
    environment:
      # 读接口封锁令牌：设置后数据接口只对服务端渲染请求与管理员会话开放。
      # 与 web 服务共用同一个值，在同目录 .env 里生成一次即可：openssl rand -hex 32
      PRICE_WEB_INTERNAL_TOKEN: ${PRICE_WEB_INTERNAL_TOKEN:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8437/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      target: web
    image: llm-price-monitor/web:local
    container_name: price-monitor-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PRICE_WEB_API_URL: http://api:8437 # 需与 Dockerfile 中 web-builder 的 ARG 保持一致
      # 与 api 服务相同的封锁令牌：Next 服务端渲染请求据此直连数据接口
      PRICE_WEB_INTERNAL_TOKEN: ${PRICE_WEB_INTERNAL_TOKEN:-}
    ports:
      - "3000:3000" # 唯一对外端口；8437 不发布，仅容器网络内可达。被占用时改成 "8080:3000" 并同步反代目标
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
